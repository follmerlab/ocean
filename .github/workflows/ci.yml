name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: SeaBreeze imports (driver backend present)
        run: python -c "import seabreeze; seabreeze.use('cseabreeze'); import seabreeze.spectrometers as sb; print('seabreeze', seabreeze.__version__, 'devices:', sb.list_devices())"
      - name: Tests (simulated spectrometer)
        run: pytest -v
      - name: App starts
        run: python app.py --help
